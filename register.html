<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title> <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="login-reg-container" class="registeren">
      <div class="imgcontainer">
  </div>

    <div id="container">
        <h2 id="h2">Registreren</h2>

        <label id="text" for="e-mail"><b>E-mail:</b></label>
        <input type="text" placeholder="Enter E-mail" required>

        <label id="text" for="Username"><b>Username:</b></label>
        <input type="text" placeholder="Enter Username" required> 

        <label id="text" for="password"><b>Password:</b></label>
        <input type="password" placeholder="Enter Password" required>

        <label id="text" for="password"><b>Repeat Password:</b></label>
        <input type="password" placeholder="Repeat Password" required>

        <button class="registeren-button" type="submit">Registreren</button>
        <p class="tekst-link">already have a account? <a href="login.html" class="link">login here</a>
    </div>
    <script src="javascript.js"></script>
</body>
</html>
